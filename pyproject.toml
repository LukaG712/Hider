[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hider"
version = "1.0.0"
description = "Secret and configuration management for the Evershade ecosystem"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "LukaG712"}]
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "python-dotenv==1.0.1",
    "cryptography==42.0.0",
]

[project.urls]
Homepage = "https://github.com/LukaG712/Hider"
Repository = "https://github.com/LukaG712/Hider"

[project.optional-dependencies]
dev = ["pytest==8.3.0", "pytest-asyncio==0.24.0", "pytest-timeout==2.3.1", "ruff==0.9.0", "httpx"]

[tool.setuptools.packages.find]
include = ["hider*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
